server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: app

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/taskmanager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: lA6JFIP/VnFgRFB717pog4Hqud5O0mtlWtGi5P7L8nY=
  expiration: 86400000
  refresh-expiration: 604800000


logging:
  level:
    root: INFO
    com.javarush: DEBUG
    org.springframework.security: INFO
    org.springframework.boot.web.servlet: DEBUG
    org.springframework.web: INFO
    org.hibernate.sql: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  file:
    name: logs/taskmanager.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: false
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [reqId=%X{requestId}] [user=%X{user}] [ip=%X{ip}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorted: method
    tagsSorted: alpha
  show-actuator: true
