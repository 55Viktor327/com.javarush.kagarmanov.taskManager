server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: app

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/task_manager
    username: ${USER} postgres
    password: ${PASSWORD} postgres

  jpa:
    hibernate:
      ddl-auto: create
      show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
